# Render Blueprint - optional for one-click deploy
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: honeypot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
